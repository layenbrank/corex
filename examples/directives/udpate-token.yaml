# goview 登录 → 提取 token → 更新 request.js 中的 initToken
#
# 运行（全部使用默认值）:
#   corex run http-extract-patch
#
# 覆盖账号或目标文件:
#   corex run http-extract-patch --input username=dba --input password='iwell@123'
#   corex run http-extract-patch --input target="C:/path/to/request.js"
#
# 响应路径: data.token.tokenValue → request.js 的 const initToken
name: http-extract-patch
description: POST 登录 goview，提取 token 并写入 iwellnew request.js
version: "1.2"

inputs:
  - name: url
    description: 登录 API
    required: false
    default: "http://172.16.0.8:9001/go/api/goview/sys/login"
  - name: username
    description: 登录用户名
    required: false
    default: "dba"
  - name: password
    description: 登录密码
    required: false
    default: "iwell@123"
  - name: target
    description: 待更新 initToken 的前端 request.js
    required: false
    default: "{{env.USERPROFILE}}\\Documents\\source code of business\\iwellnew\\src\\api\\request.js"

permissions:
  network: true
  filesystem: true

steps:
  - id: login
    action: http.send
    params:
      url: "{{url}}"
      method: POST
      headers:
        Accept: application/json
        Content-Type: application/json
      json:
        username: "{{username}}"
        password: "{{password}}"
      timeout_ms: 30000
    save_to: raw

  - id: parsed
    action: codec.json.parse
    params:
      text: "{{raw.body}}"
    save_to: parsed

  - id: patch_token
    action: file.write
    params:
      path: "{{target}}"
      mode: regex
      pattern: "(?s)const initToken\\s*=\\s*\\n\\s*'[^']*'"
      replacement: "const initToken =\n  '{{parsed.data.token.tokenValue}}'"
      backup: true

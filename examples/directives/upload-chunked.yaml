# 大文件分片上传 —— generate.hash 摘要 + generate.chunks 切块 + http.send(multipart) 逐片上传
#
# 服务端契约（以本机 services/upload 为准）：
#   POST  /api/v1/auth/signin     {username, password, captchaKey, captchaValue} → data.token
#   POST  /api/v1/upload/prepare  {name, size, mime, chunk}                      → data.id（不带 hash）
#   PATCH /api/v1/upload/hash     {id, hash}        # 整文件 sha256，算完即绑（可命中秒传）
#   POST  /api/v1/upload/chunk    multipart: id / index / hash + chunk(这一片的字节)
#   POST  /api/v1/upload/finalize {id}              # 服务端按序校验整文件 hash
#
# 职责划分（一件事一个动作，不互相兼职）：
# - `generate.chunks` 只切块：给每片的 index/offset/length，不读内容也不算摘要。
# - `generate.hash` 只算摘要：整文件（不给 offset/length）或某一片（给 offset/length）。
# - 两条线并行：整文件摘要算完立刻 PATCH，与逐片上传同时进行（对应参考实现的
#   `Promise.all([bindHashTask, chunksTask])`）。这条并行是真收益：大文件的摘要要算
#   几十秒，让它搭上传的车。
# - 分片之间并发：`max_concurrency` 与 `repeat` **同级**（省略 / `1` = 串行，元素共享
#   一份上下文；`> 1` = 并发，每个元素一份上下文副本）。并发度按在途内存算
#   （≈ 并发度 × chunk）；若元素之间需要互相看到变量，就用串行。
# - 断点续传：`prepare` 回的已传分片里，index 相同**且 hash 一致**的片直接跳过；
#   hash 不一致说明服务端那份不对，照传。
# - development 下验证码关着，占位填 `captchaKey: dev` / `captchaValue: "0"`。
#
# 运行:
#   corex run upload-chunked -i file=D:/big.bin
#   corex run upload-chunked -i file=D:/big.bin -i base=http://127.0.0.1:3000
#
# 夜里自动上传：`corex cron start` 之后用 cron 注册本指令，或给指令加 `triggers: [{type: cron, …}]`。
name: upload-chunked
description: 把一个大文件分片上传（先算摘要，再逐片 multipart 上传，最后 finalize）
version: "1.0"

permissions:
  filesystem: true
  network: true

inputs:
  - name: file
    description: 要上传的本地文件
    required: true
  - name: base
    description: 服务基址
    required: false
    default: "http://127.0.0.1:3000"
  - name: user
    description: 登录用户名
    required: false
    default: admin
  - name: password
    description: 登录密码
    required: false
    default: "123456"
  - name: chunk
    description: 分片大小（字节；该服务要求 10MB~100MB）
    required: false
    default: 10485760

steps:
  - id: stat
    action: file.read
    params:
      path: "{{input.file}}"
      mode: stat

  - id: plan
    action: generate.chunks
    params:
      path: "{{input.file}}"
      chunk: "{{input.chunk}}"

  - id: signin
    action: http.send
    params:
      url: "{{input.base}}/api/v1/auth/signin"
      method: POST
      json:
        username: "{{input.user}}"
        password: "{{input.password}}"
        captchaKey: dev
        captchaValue: "0"

  - id: auth
    action: codec.json.parse
    params:
      text: "{{steps.signin.body}}"

  # 秒传：prepare 带上整文件 hash，服务端已有同样布局就直接复用，一片都不用传。
  - id: prepare
    action: http.send
    params:
      url: "{{input.base}}/api/v1/upload/prepare"
      method: POST
      token: "{{steps.auth.data.token}}"
      json:
        name: "{{steps.stat.name}}"
        size: "{{steps.plan.size}}"
        mime: application/octet-stream
        chunk: "{{steps.plan.chunk}}"

  - id: session
    action: codec.json.parse
    params:
      text: "{{steps.prepare.body}}"

  # 服务端已传的分片 `[{index, hash}, …]`。
  # 字段缺席时 `codec.json.pick` 给的是 Null，`contains` 自然判为「没有」——
  # 不需要「取不到就给空表」那种兜底。
  - id: uploaded
    action: codec.json.pick
    params:
      value: "{{steps.session.data}}"
      pointer: /uploaded

  # 两条线并行：上＝流式算整文件摘要，算完立刻 PATCH（不等分片传完）；
  # 下＝逐片算这一片的摘要并上传。这里的 `max_concurrency` 只管这两条线，
  # 分片之间自己还有一层并发（见下面 parts）。
  - id: fanout
    max_concurrency: 2
    parallel:
      - id: bind_hash
        steps:
          - id: digest
            action: generate.hash
            params:
              path: "{{input.file}}"
          - id: patch
            action: http.send
            params:
              url: "{{input.base}}/api/v1/upload/hash"
              method: PATCH
              token: "{{steps.auth.data.token}}"
              json:
                id: "{{steps.session.data.id}}"
                hash: "{{steps.digest.hex}}"

      - id: parts
        # 分片之间并发：`max_concurrency` 与 `repeat` 同级，省略（或写 `1`）就是串行。
        # 并发时每个元素一份上下文副本，跑完按元素顺序合并回来；在途 ≈ 并发度 × chunk。
        max_concurrency: 2
        repeat:
          each: "{{steps.plan.chunks}}"
          as: part
        steps:
          # 每片的摘要：只读这一片（offset/length），不碰整文件。
          - id: piece
            action: generate.hash
            params:
              path: "{{input.file}}"
              offset: "{{part.offset}}"
              length: "{{part.length}}"

          - id: put
            action: http.send
            # 两个跳过条件都挂在步骤上（`repeat` 上没有 `when`）：
            #   整文件已秒传 → 一片也不用传；
            #   这一片服务端已有且 hash 一致 → 只跳过这一片。
            # `contains` 对对象数组是子集匹配，所以只写我们关心的两个字段，
            # 服务端多带 `size` / `updatedAt` 之类不影响。
            when:
              and:
                - ne: ["{{steps.session.data.exists}}", true]
                - not:
                    contains:
                      - "{{steps.uploaded}}"
                      - index: "{{part.index}}"
                        hash: "{{steps.piece.hex}}"
            params:
              url: "{{input.base}}/api/v1/upload/chunk"
              method: POST
              token: "{{steps.auth.data.token}}"
              multipart:
                id: "{{steps.session.data.id}}"
                index: "{{part.index}}"
                hash: "{{steps.piece.hex}}"
                chunk:
                  path: "{{input.file}}"
                  offset: "{{part.offset}}"
                  length: "{{part.length}}"
                  filename: "chunk-{{part.index}}.part"
                  content_type: application/octet-stream
            retry: 2

  - id: finalize
    action: http.send
    params:
      url: "{{input.base}}/api/v1/upload/finalize"
      method: POST
      token: "{{steps.auth.data.token}}"
      json:
        id: "{{steps.session.data.id}}"

  - id: done
    action: codec.json.parse
    params:
      text: "{{steps.finalize.body}}"

# copy.run — 文件/目录复制（含 includes / excludes）
#
# 运行（默认复制 hello.yaml 到临时目录）:
#   corex run copy-demo
#
# 指定源与目标:
#   corex run copy-demo -i from=./examples/directives -i to="{{env.TEMP}}/corex-copy-demo"
#
# 输出 save_to copied: { ... copy.run 结果 ... }
name: copy-demo
description: 演示 copy.run 复制文件或目录树
version: "1.1"

inputs:
  - name: from
    description: 源文件或目录
    required: false
    default: "./examples/directives/hello.yaml"
  - name: to
    description: 目标路径
    required: false
    default: "{{env.TEMP}}/corex-copy-demo/hello.yaml"

permissions:
  filesystem: true

steps:
  - id: copy
    action: copy.run
    params:
      from: "{{input.from}}"
      to: "{{input.to}}"
      empty: false
    save_to: copied

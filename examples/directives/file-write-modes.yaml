# file.write 迷你 IDE modes — overwrite / splice / json_set / regex / str_replace / lines / patch
#
# 运行:
#   corex run file-write-modes
#
# 产物目录: {{env.TEMP}}/corex-file-modes/
name: file-write-modes
description: 演示 file.write / file.read 的迷你 IDE 能力
version: "1.0"

inputs:
  - name: base_dir
    description: 示例文件输出目录
    required: false
    default: "{{env.TEMP}}/corex-file-modes"

permissions:
  filesystem: true

variables:
  marker_start: "/* START */"
  marker_end: "/* END */"

steps:
  - id: seed_text
    action: file.write
    params:
      path: "{{input.base_dir}}/note.txt"
      content: |
        line1
        {{marker_start}}
        OLD
        {{marker_end}}
        line2
      mode: overwrite
      create_dirs: true

  - id: seed_json
    action: file.write
    params:
      path: "{{input.base_dir}}/meta.json"
      content: '{"name":"corex","version":1}'
      mode: overwrite

  - id: patch_splice
    action: file.write
    params:
      path: "{{input.base_dir}}/note.txt"
      mode: splice
      start: "{{marker_start}}"
      end: "{{marker_end}}"
      content: "NEW-BUILD"

  - id: patch_json
    action: file.write
    params:
      path: "{{input.base_dir}}/meta.json"
      mode: json_set
      pointer: "version"
      value: 2

  - id: patch_regex
    action: file.write
    params:
      path: "{{input.base_dir}}/note.txt"
      mode: regex
      pattern: "^line1"
      replacement: "line1-patched"

  - id: str_replace
    action: file.write
    params:
      path: "{{input.base_dir}}/note.txt"
      mode: str_replace
      old: "line2"
      new: "line2-done"

  - id: append_tail
    action: file.write
    params:
      path: "{{input.base_dir}}/note.txt"
      mode: append
      content: |
        tail

  - id: read_lines
    action: file.read
    params:
      path: "{{input.base_dir}}/note.txt"
      mode: lines
      start_line: 1
      limit: 3
    save_to: note_head

  - id: read_back
    action: file.read
    params:
      path: "{{input.base_dir}}/note.txt"
    save_to: note_final

  - id: read_json
    action: file.read
    params:
      path: "{{input.base_dir}}/meta.json"
    save_to: json_final

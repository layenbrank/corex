# HTTP POST → JSON 提取 → file.write regex 补丁
#
# 场景: POST 登录类 API，从响应 JSON 取 token，用 regex 更新 JS 中的 initToken
# 本示例使用 httpbin.org/post 公网 echo，无需真实凭据
#
# 运行:
#   corex run http-extract-patch
#   corex run http-extract-patch -i username=demo -i password=secret-token-123
#   corex run http-extract-patch -i target="{{env.TEMP}}/my-request.js"
#
# 链路: file.write(seed) → http.send → codec.json.parse → file.write(regex)
# JSON 路径: parsed.json.password（httpbin 回显请求体中的 password 字段）
name: http-extract-patch
description: POST JSON、提取 echo 字段并用 regex 更新 initToken（演示用 httpbin）
version: "1.3"

inputs:
  - name: url
    description: POST 目标 URL
    required: false
    default: "https://httpbin.org/post"
  - name: username
    description: 登录用户名（占位符，请替换为你的值）
    required: false
    default: "YOUR_USERNAME"
  - name: password
    description: 用作 token 的密码字段（占位符）
    required: false
    default: "YOUR_PASSWORD"
  - name: target
    description: 待更新 initToken 的 JS 文件
    required: false
    default: "{{env.TEMP}}/corex-request-demo.js"

permissions:
  network: true
  filesystem: true

steps:
  - id: seed
    action: file.write
    params:
      path: "{{input.target}}"
      mode: overwrite
      create_dirs: true
      content: |
        // corex http-extract-patch demo
        const initToken =
          'PLACEHOLDER'

  - id: login
    action: http.send
    params:
      url: "{{input.url}}"
      method: POST
      headers:
        Accept: application/json
        Content-Type: application/json
      json:
        username: "{{input.username}}"
        password: "{{input.password}}"
      timeout_ms: 30000
    save_to: raw

  - id: parsed
    action: codec.json.parse
    params:
      text: "{{raw.body}}"
    save_to: parsed

  - id: patch_token
    action: file.write
    params:
      path: "{{input.target}}"
      mode: regex
      pattern: "(?s)const initToken\\s*=\\s*\\n\\s*'[^']*'"
      replacement: "const initToken =\n  '{{parsed.json.password}}'"
      backup: true

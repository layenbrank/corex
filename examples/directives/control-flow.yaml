# 控制流基础 — if / else / repeat.count
#
# 运行:
#   corex run control-flow
#   corex run control-flow -i mode=prod
#   corex run control-flow -i mode=staging
#
# 最终变量 last 可在输出 JSON 的 variables 中查看
name: control-flow
description: if 分支与固定次数 repeat（仅 template.render）
version: "1.1"

inputs:
  - name: mode
    description: 分支选择器（prod 走 then，其它走 else）
    required: false
    default: "dev"

variables:
  enabled: true

steps:
  - id: branch
    if:
      eq: ["{{input.mode}}", "prod"]
    then:
      - id: prod_msg
        action: template.render
        params:
          template: "running in prod"
        save_to: label
    else:
      - id: dev_msg
        action: template.render
        params:
          template: "running in {{input.mode}}"
        save_to: label

  - id: loop
    repeat:
      count: 2
      as: n
    steps:
      - id: tick
        action: template.render
        params:
          template: "{{label}} #{{n}}"
        save_to: last

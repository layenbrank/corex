<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      只允许加载本地脚本与内联样式：渲染进程不需要（也不该）从网络取任何东西。
      Electron 在开发时会因为缺 CSP 而在控制台警告，这是它想看的那一条。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Corex × Electron</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0 auto;
        max-width: 880px;
        padding: 24px;
        line-height: 1.5;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 14px;
        opacity: 0.75;
      }
      section {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid color-mix(in srgb, currentColor 15%, transparent);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .status {
        margin: 0 0 12px;
        font-size: 13px;
        opacity: 0.8;
      }
      .muted {
        margin: 8px 0;
        font-size: 12px;
        opacity: 0.7;
      }
      label {
        font-size: 13px;
        opacity: 0.8;
      }
      select,
      textarea,
      button {
        font: inherit;
        font-size: 13px;
      }
      select {
        min-width: 220px;
      }
      textarea {
        width: 100%;
        margin-top: 6px;
        font-family: ui-monospace, Consolas, monospace;
      }
      button {
        padding: 4px 12px;
        cursor: pointer;
      }
      .panel {
        margin: 0;
        max-height: 220px;
        overflow: auto;
        padding: 10px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        background: color-mix(in srgb, currentColor 6%, transparent);
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Corex × Electron</h1>
    <p
      id="status"
      class="status"
    >
      正在连接…
    </p>
    <div class="row">
      <button id="start">启动</button>
      <button id="stop">停止</button>
    </div>

    <section>
      <h2>调用单个 Action</h2>
      <div class="row">
        <label for="action">Action</label>
        <select id="action"></select>
      </div>
      <p
        id="action-meta"
        class="muted"
      ></p>
      <label for="params">params（JSON，已按目录里的 input_schema 预填）</label>
      <textarea
        id="params"
        rows="7"
        spellcheck="false"
      ></textarea>
      <div class="row">
        <button id="invoke">执行 invoke</button>
      </div>
    </section>

    <section>
      <h2>执行指令</h2>
      <div class="row">
        <label for="directive">指令</label>
        <select id="directive"></select>
        <button id="run">执行 run</button>
      </div>
    </section>

    <section>
      <h2>结果</h2>
      <pre
        id="result"
        class="panel"
      >
—</pre
      >
    </section>

    <section>
      <h2>进度帧</h2>
      <pre
        id="log"
        class="panel"
      ></pre>
    </section>

    <script src="renderer.js"></script>
  </body>
</html>

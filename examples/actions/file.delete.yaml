# file.delete — 最小示例（先 copy 再 delete，见 file-ops-demo）
# 运行: corex run examples/actions/file.delete.yaml
name: action-file-delete
description: "Action: file.delete"
permissions:
  filesystem: true
steps:
  - id: seed
    action: file.write
    params:
      path: "{{env.TEMP}}/corex-file-delete-me.txt"
      content: "delete me"
      mode: overwrite
      create_dirs: true
  - id: demo
    action: file.delete
    params:
      path: "{{env.TEMP}}/corex-file-delete-me.txt"
    save_to: result

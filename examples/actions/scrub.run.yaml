# scrub.run — 最小示例
# 运行: corex run examples/actions/scrub.run.yaml
name: action-scrub-run
description: "Action: scrub.run"
permissions:
  filesystem: true
steps:
  - id: seed
    action: file.write
    params:
      path: "{{env.TEMP}}/corex-scrub/stale.tmp"
      content: x
      mode: overwrite
      create_dirs: true
  - id: demo
    action: scrub.run
    params:
      source: "{{env.TEMP}}/corex-scrub"
      target: stale.tmp
      recursive: true
    save_to: result

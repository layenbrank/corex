[package]
name        = "corex-registry"
version     = { workspace = true }
edition     = { workspace = true }
description = "Action registry and builtin actions"
authors     = { workspace = true }
license     = { workspace = true }

[features]
# 默认发布形态：所有内置动作，但**不含** `wasm`。
#
# 只有 `corex-daemon` 会发现并加载插件，把 wasm 运行时链进 CLI 属于够不着的
# 体积。因此 `wasm` 是可选开启的，且由唯一真正会用到它的消费方声明。
default = ["all-actions"]
all-actions = [
  "act-shell",
  "act-http",
  "act-clipboard",
  "act-notify",
  "act-file",
  "act-template",
  "act-cron",
  "act-keyring",
  "act-copy",
  "act-scrub",
  "act-shade",
  "act-compression",
  "act-generate",
  "act-exec",
  "act-bootstrap",
  "act-codec",
  "act-scan",
  "act-capture",
  "act-morph",
  "act-ui",
  "act-sys",
  "act-html",
  "act-text",
]

# 共享的 Windows feature 包（经 act-* 开启；保持 windows 可选 + default-features=false）。
win32-base = [
  "dep:windows",
  "windows/Win32_Foundation",
  "windows/Win32_UI_WindowsAndMessaging",
]
win32-process = ["win32-base", "windows/Win32_System_Diagnostics_ToolHelp"]
winrt-ocr = [
  "dep:windows",
  "windows/std",
  "windows/Foundation",
  "windows/Graphics_Imaging",
  "windows/Media_Ocr",
  "windows/Storage",
  "windows/Storage_Streams",
]

# encoding_rs：Windows 管道子进程常出 OEM/GBK，不能只靠 from_utf8_lossy。
act-shell = ["win32-process", "dep:encoding_rs"]
act-http = ["dep:reqwest", "dep:encoding_rs"]
act-html = ["dep:scraper", "dep:url"]
act-clipboard = ["dep:arboard", "dep:image"]
act-notify = ["dep:notify-rust"]
act-file = ["dep:regex", "dep:uuid", "dep:ropey", "dep:diffy"]
act-template = ["dep:minijinja"]
act-cron = ["dep:corex-engine", "dep:corex-ipc", "dep:uuid"]
act-keyring = ["dep:keyring"]
act-copy = ["dep:walkdir", "dep:glob"]
act-scrub = ["dep:walkdir"]
act-shade = ["dep:image", "dep:walkdir"]
act-compression = [
  "dep:zip",
  "dep:walkdir",
  "dep:flate2",
  "dep:tar",
  "dep:glob",
]
act-generate = [
  "dep:uuid",
  "dep:rand",
  "dep:walkdir",
  "dep:glob",
  "dep:chrono",
  "dep:sha2",
  "dep:md-5",
  "dep:base64",
]
act-exec = ["win32-process", "dep:encoding_rs"]
act-bootstrap = []
act-codec = ["dep:base64", "dep:md-5", "dep:percent-encoding"]
act-scan = ["dep:sysinfo"]
act-capture = ["dep:image", "dep:base64", "dep:screenshots", "winrt-ocr"]
act-morph = ["dep:lopdf", "dep:base64"]
act-text = ["dep:regex"]
act-ui = [
  "win32-base",
  "dep:uiautomation",
  "windows/Win32_Graphics_Gdi",
  "windows/Win32_System_Console",
  "windows/Win32_System_LibraryLoader",
  "windows/Win32_UI_HiDpi",
  "windows/Win32_UI_Input_KeyboardAndMouse",
]
act-sys = [
  "win32-base",
  "win32-process",
  "windows/Win32_UI_Shell",
  "windows/Win32_System_Threading",
]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
corex-core    = { workspace = true }
corex-engine  = { workspace = true, optional = true, features = ["cron"] }
corex-ipc     = { workspace = true, optional = true }
async-trait   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
reqwest       = { workspace = true, optional = true }
encoding_rs   = { workspace = true, optional = true }
scraper       = { workspace = true, optional = true }
url           = { workspace = true, optional = true }
arboard       = { workspace = true, optional = true }
notify-rust   = { workspace = true, optional = true }
minijinja     = { workspace = true, optional = true, features = ["urlencode"] }
keyring       = { workspace = true, optional = true }
wasmtime      = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
walkdir       = { workspace = true, optional = true }
glob          = { workspace = true, optional = true }
base64        = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
md-5          = { workspace = true, optional = true }
sha2          = { workspace = true, optional = true }
sysinfo       = { workspace = true, optional = true }
image         = { workspace = true, optional = true }
zip           = { workspace = true, optional = true }
flate2        = { workspace = true, optional = true }
tar           = { workspace = true, optional = true }
rand          = { workspace = true, optional = true }
regex         = { workspace = true, optional = true }
ropey         = { workspace = true, optional = true }
diffy         = { workspace = true, optional = true }
uuid          = { workspace = true, optional = true }
chrono        = { workspace = true, optional = true }
lopdf         = { workspace = true, optional = true }
screenshots   = { version = "0.8", optional = true }

[target.'cfg(windows)'.dependencies]
uiautomation = { version = "0.25", optional = true }
windows      = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["rt-multi-thread", "macros"] }
proptest = { workspace = true }

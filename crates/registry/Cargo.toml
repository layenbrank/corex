[package]
name        = "corex-registry"
version     = { workspace = true }
edition     = { workspace = true }
description = "Action registry and builtin actions"
authors     = { workspace = true }
license     = { workspace = true }

[features]
default = ["full"]
full = [
  "act-shell",
  "act-http",
  "act-clipboard",
  "act-notify",
  "act-file",
  "act-template",
  "act-cron",
  "act-keyring",
  "act-copy",
  "act-scrub",
  "act-shade",
  "act-compression",
  "act-generate",
  "act-exec",
  "act-bootstrap",
  "act-codec",
  "act-scan",
  "act-capture",
  "act-morph",
  "act-ui",
  "wasm",
]
act-shell = []
act-http = ["dep:reqwest"]
act-clipboard = ["dep:arboard", "dep:image"]
act-notify = ["dep:notify-rust"]
act-file = ["dep:regex", "dep:uuid"]
act-template = ["dep:minijinja"]
act-cron = []
act-keyring = ["dep:keyring"]
act-copy = ["dep:walkdir", "dep:glob"]
act-scrub = ["dep:walkdir"]
act-shade = ["dep:image", "dep:walkdir"]
act-compression = [
  "dep:zip",
  "dep:walkdir",
  "dep:flate2",
  "dep:tar",
  "dep:glob",
]
act-generate = ["dep:uuid", "dep:rand", "dep:walkdir", "dep:glob", "dep:chrono"]
act-exec = []
act-bootstrap = []
act-codec = ["dep:base64", "dep:md-5"]
act-scan = ["dep:sysinfo"]
act-capture = ["dep:image", "dep:base64", "dep:screenshots"]
act-morph = ["dep:lopdf", "dep:base64"]
act-ui = ["dep:uiautomation"]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
corex-core    = { workspace = true }
async-trait   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
reqwest       = { workspace = true, optional = true }
arboard       = { workspace = true, optional = true }
notify-rust   = { workspace = true, optional = true }
minijinja     = { workspace = true, optional = true }
keyring       = { workspace = true, optional = true }
wasmtime      = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
walkdir       = { workspace = true, optional = true }
glob          = { workspace = true, optional = true }
base64        = { workspace = true, optional = true }
md-5          = { workspace = true, optional = true }
sysinfo       = { workspace = true, optional = true }
image         = { workspace = true, optional = true }
zip           = { workspace = true, optional = true }
flate2        = { workspace = true, optional = true }
tar           = { workspace = true, optional = true }
rand          = { workspace = true, optional = true }
regex         = { workspace = true, optional = true }
uuid          = { workspace = true, optional = true }
chrono        = { workspace = true, optional = true }
lopdf         = { workspace = true, optional = true }
screenshots   = { version = "0.8", optional = true }

[target.'cfg(windows)'.dependencies]
uiautomation = { version = "0.25", optional = true }
windows = { version = "0.58", features = [
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Foundation",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
tempfile  = { workspace = true }
tokio     = { workspace = true, features = ["rt-multi-thread", "macros"] }
proptest = { workspace = true }

name: Build and Test

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ''
  CARGO_INCREMENTAL: '0'

jobs:
  windows:
    name: windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace (debug)
        run: cargo build --workspace --locked --verbose

      - name: Test workspace (debug)
        run: cargo test --workspace --locked --verbose

      - name: Verify daemon binary name
        shell: pwsh
        run: |
          if (-not (Test-Path 'target/debug/corex-daemon.exe')) {
            Write-Error 'expected target/debug/corex-daemon.exe'
            exit 1
          }
          if (Test-Path 'target/debug/corex-serve.exe') {
            Write-Error 'obsolete corex-serve.exe should not be built'
            exit 1
          }
          Write-Host 'corex-daemon artifact OK'

      # 冷启动是 CLI 对用户可见的性质：不能因为新增依赖而逐步变慢。
      # 这个上限刻意放宽（docs/ops/性能基线.md 里的发布基线大约低两个数量级），
      # 以便拦住结构性回归——启动时扫插件目录或加载运行时——而不是计时噪声。
      - name: Cold start and binary size
        shell: pwsh
        run: |
          $exe = 'target/debug/corex.exe'
          $times = 1..10 | ForEach-Object {
            (Measure-Command { & $exe --version | Out-Null }).TotalMilliseconds
          }
          $sorted = $times | Sort-Object
          $median = $sorted[[int]($sorted.Count / 2)]
          $max = ($times | Measure-Object -Maximum).Maximum
          Write-Host ('cold start: median {0:N0} ms, max {1:N0} ms over {2} runs' -f $median, $max, $times.Count)
          foreach ($name in @('corex.exe', 'corex-daemon.exe')) {
            $p = Join-Path 'target/debug' $name
            Write-Host ('{0}: {1:N2} MB' -f $name, ((Get-Item $p).Length / 1MB))
          }
          if ($median -gt 2000) {
            Write-Error ('cold start regressed: median {0:N0} ms > 2000 ms' -f $median)
            exit 1
          }

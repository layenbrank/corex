name: Publish Release

# 企业级 Windows x64 发版（供 i-thinking / Tauri 消费）
# - SemVer tag 与 workspace.package.version 强制对齐
# - 渠道：stable | alpha | beta | rc（由 tag 后缀决定）
# - ZIP：corex.exe + corex-daemon.exe + pdfium.dll（若存在）
# - 资产名：corex-{tag}-windows-x64.zip（prepare.ts 约定）
#
# 发布示例（changelog 须在 tag 前本地用 git-cliff 生成并提交，本 workflow 不跑 cliff）：
#   git-cliff --bumped-version
#   # bump Cargo.toml [workspace.package].version + git-cliff -o CHANGELOG.md + commit
#   git tag v4.0.0 && git push && git push --tags
#   git tag v4.0.0-beta.1 && git push --tags
#   # 或 Actions → Publish Release → workflow_dispatch 指定 tag
# 完整流程：docs/ops/发布与Changelog.md

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v4.0.0 / v4.0.0-beta.1); required when not on a tag push
        required: false
        type: string
      draft:
        description: Create draft Release (manual publish after review)
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.ref }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ''
  CARGO_INCREMENTAL: '0'
  RUST_TARGET: x86_64-pc-windows-msvc
  TARGET_DIR: target/x86_64-pc-windows-msvc/release

jobs:
  windows-x64:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.tag }}" -ne "") {
            $tag = "${{ inputs.tag }}".Trim()
          } else {
            Write-Error "No tag: push a v* tag, or pass workflow_dispatch input tag"
            exit 1
          }

          if ($tag -notmatch '^v(?<ver>\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)(?:\.\d+)?)?)$') {
            Write-Error "Invalid tag '$tag'. Expected SemVer: v1.2.0 | v1.2.0-alpha.1 | v1.2.0-beta.1 | v1.2.0-rc.1"
            exit 1
          }

          $version = $Matches['ver']
          $channel = 'stable'
          $isPrerelease = $false
          if ($version -match '-alpha(?:\.|$)') { $channel = 'alpha'; $isPrerelease = $true }
          elseif ($version -match '-beta(?:\.|$)') { $channel = 'beta'; $isPrerelease = $true }
          elseif ($version -match '-rc(?:\.|$)') { $channel = 'rc'; $isPrerelease = $true }

          $draft = '${{ inputs.draft }}' -eq 'true'

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "is_prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "draft=$($draft.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "zip_name=corex-$tag-windows-x64.zip" >> $env:GITHUB_OUTPUT

          Write-Host "tag=$tag version=$version channel=$channel prerelease=$isPrerelease draft=$draft"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Enforce version alignment
        shell: pwsh
        run: |
          $expected = "${{ steps.meta.outputs.version }}"
          $cargoToml = Get-Content Cargo.toml -Raw
          if ($cargoToml -notmatch '(?ms)\[workspace\.package\][^\[]*?^version\s*=\s*"([^"]+)"') {
            Write-Error "Cargo.toml [workspace.package] version not found"
            exit 1
          }
          $actual = $Matches[1]
          if ($actual -ne $expected) {
            Write-Error "Version gate failed. Tag implies '$expected', but [workspace.package].version='$actual'. Bump Cargo.toml, commit, tag v$expected, and push."
            exit 1
          }
          Write-Host "Version alignment OK: $expected"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ env.RUST_TARGET }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-${{ env.RUST_TARGET }}

      - name: Download native dependencies
        shell: pwsh
        run: pwsh -File scripts/download-pdfium.ps1

      - name: Build release binaries
        shell: pwsh
        run: |
          cargo build -p corex -p corex-daemon -p pdfium --release --locked --target $env:RUST_TARGET --verbose

      - name: Test workspace (release)
        shell: pwsh
        run: cargo test --workspace --release --locked --target $env:RUST_TARGET --verbose

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $dir = $env:TARGET_DIR
          $required = @('corex.exe', 'corex-daemon.exe')
          foreach ($name in $required) {
            $path = Join-Path $dir $name
            if (-not (Test-Path $path)) {
              Write-Error "Missing required artifact: $path"
              Get-ChildItem $dir -ErrorAction SilentlyContinue | Select-Object Name, Length
              exit 1
            }
            $sizeMb = (Get-Item $path).Length / 1MB
            Write-Host "OK $name ($([math]::Round($sizeMb, 2)) MB)"
          }

          $pdfium = Join-Path $dir 'pdfium.dll'
          if (Test-Path $pdfium) {
            $sizeMb = (Get-Item $pdfium).Length / 1MB
            Write-Host "OK pdfium.dll ($([math]::Round($sizeMb, 2)) MB)"
          } else {
            Write-Warning "pdfium.dll not found under $dir (optional until morph lands)"
          }

          $daemon = Join-Path $dir 'corex-daemon.exe'
          $help = & $daemon --help 2>&1 | Out-String
          if ($help -notmatch '--socket') {
            Write-Error "corex-daemon.exe is not the IPC daemon (missing --socket). Output:`n$help"
            exit 1
          }
          if ($help -match '<COMMAND>') {
            Write-Error "corex-daemon.exe looks like the CLI (found <COMMAND>). Refusing to package."
            exit 1
          }
          Write-Host "corex-daemon check OK (--socket present)"

          $cli = Join-Path $dir 'corex.exe'
          $cliHelp = & $cli --help 2>&1 | Out-String
          if ($cliHelp -notmatch '(?i)Usage:') {
            Write-Error "corex.exe --help did not look like a CLI. Output:`n$cliHelp"
            exit 1
          }
          Write-Host "corex CLI check OK"

      - name: Create release package
        shell: pwsh
        run: |
          $dir = $env:TARGET_DIR
          $zipName = "${{ steps.meta.outputs.zip_name }}"
          $pkg = 'release-package'
          $out = 'release-artifacts'

          if (Test-Path $pkg) { Remove-Item -Recurse -Force $pkg }
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item (Join-Path $dir 'corex.exe') $pkg
          Copy-Item (Join-Path $dir 'corex-daemon.exe') $pkg
          $pdfium = Join-Path $dir 'pdfium.dll'
          if (Test-Path $pdfium) {
            Copy-Item $pdfium $pkg
          }

          if (Test-Path 'README.md') { Copy-Item README.md $pkg }
          if (Test-Path 'LICENSE') { Copy-Item LICENSE $pkg }
          if (Test-Path 'CHANGELOG.md') { Copy-Item CHANGELOG.md $pkg }

          $zipPath = Join-Path $out $zipName
          Compress-Archive -Path (Join-Path $pkg '*') -DestinationPath $zipPath -Force

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Out-File -Encoding ascii (Join-Path $out "$zipName.sha256")
          Write-Host "SHA256 ${zipName}: $hash"

          $sums = Join-Path $out 'SHA256SUMS.txt'
          Get-ChildItem $pkg -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)" | Out-File -Encoding ascii -Append $sums
            Write-Host "SHA256 $($_.Name): $h"
          }
          $zipHashLine = "$hash  $zipName"
          $zipHashLine | Out-File -Encoding ascii -Append $sums

          Write-Host "Release artifacts:"
          Get-ChildItem $out -File | ForEach-Object { Write-Host " - $($_.Name)" }

      - name: Get build info
        id: build_info
        shell: pwsh
        run: |
          echo "hash=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          echo "short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=format:%s)" >> $env:GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=format:%an)" >> $env:GITHUB_OUTPUT
          echo "date=$(git log -1 --pretty=format:%ci)" >> $env:GITHUB_OUTPUT
          echo "rust_version=$(rustc --version)" >> $env:GITHUB_OUTPUT
          echo "cargo_version=$(cargo --version)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: release-artifacts/*
          name: Release ${{ steps.meta.outputs.tag }}
          draft: ${{ steps.meta.outputs.draft == 'true' }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.channel == 'stable' && steps.meta.outputs.draft != 'true' && steps.meta.outputs.is_prerelease != 'true' }}
          generate_release_notes: true
          body: |
            ## Corex ${{ steps.meta.outputs.tag }}

            | Field | Value |
            | --- | --- |
            | Channel | `${{ steps.meta.outputs.channel }}` |
            | Version | `${{ steps.meta.outputs.version }}` |
            | Commit | `${{ steps.build_info.outputs.short }}` |
            | Platform | Windows x64 (`x86_64-pc-windows-msvc`) |

            ### Commit
            ```
            ${{ steps.build_info.outputs.message }}
            ```

            ### Build
            - Rust: ${{ steps.build_info.outputs.rust_version }}
            - Cargo: ${{ steps.build_info.outputs.cargo_version }}
            - `cargo build -p corex -p corex-daemon -p pdfium --release --locked --target x86_64-pc-windows-msvc`

            ### Artifacts (i-thinking / Tauri)
            - `${{ steps.meta.outputs.zip_name }}` — `corex.exe` (CLI) + `corex-daemon.exe` (sidecar) + `pdfium.dll`（若存在；解压后同目录）
            - `${{ steps.meta.outputs.zip_name }}.sha256` — ZIP SHA-256
            - `SHA256SUMS.txt` — 包内文件与 ZIP 校验清单

            ### Full commit
            [`${{ steps.build_info.outputs.short }}`](https://github.com/${{ github.repository }}/commit/${{ steps.build_info.outputs.hash }})

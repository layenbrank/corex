# `build-and-test.yml` 未覆盖的质量闸门。
#
# `build-and-test.yml` 回答“在 Windows 上能否构建并跑过测试？”。
# 本工作流回答“是否格式化、lint 干净、覆盖整个 `act-*` 矩阵的特性组合、且不含
# 已知有害依赖？”——这些检查过去只存在于 `.pre-commit-config.yaml`，而那需要
# 手工 `pre-commit install`，因此从未在 CI 里跑过。
#
# 有意限定 Windows：工作区只发布 Windows 资产，而 `act-ui` / `act-sys` /
# `act-capture` 会拉入只能在 Windows 解析的依赖。在 Linux 上 lint 等于测试
# 一个没人会去构建的配置。
name: Quality

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ''
  CARGO_INCREMENTAL: '0'

jobs:
  format:
    name: format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all --check

  lint:
    name: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}

      # 这里拒绝警告，所以新的 lint 无法静默落地。
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -Dwarnings

      # `schema` 默认关闭，所以上面那一道根本看不到这部分代码。
      - name: cargo clippy (schema feature)
        run: cargo clippy -p corex-engine --features schema --all-targets --locked -- -Dwarnings

  features:
    name: feature matrix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Cache cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-features-${{ hashFiles('**/Cargo.lock') }}

      # `corex-registry` 有 21 个 `act-*` feature。没有这个任务，就只会编译
      # `full` 这一种组合，坏掉的 cfg 闸门可能一直无人发现，直到有人尝试瘦身构建。
      #
      # 这些步骤不拒绝警告：`cargo check` 不接受尾随 rustc 参数（只有
      # `cargo clippy` / `cargo rustc` 接受 `-- <args>`），而
      # `RUSTFLAGS=-Dwarnings` 会连依赖一起影响。警告的严格性由 `lint` 任务负责。
      - name: Registry with no default features
        run: cargo check -p corex-registry --no-default-features --locked

      - name: Registry feature powerset (single features)
        run: cargo hack check -p corex-registry --feature-powerset --depth 1 --keep-going --locked

      # CLI 绝不能链入 wasm 运行时：`corex run` 在进程内执行指令，只有
      # `corex-daemon` 会发现插件。旧的 `full` feature 把 41 个
      # wasmtime/cranelift crate 拖进 CLI，却没有任何可达收益；这一步挡住它回归。
      - name: CLI dependency tree is wasmtime-free
        shell: pwsh
        run: |
          $tree = cargo tree -p corex -e normal --prefix none
          $found = $tree | Where-Object { $_ -match '^(wasmtime|cranelift|wiggle|wasmparser|wasm-encoder|regalloc2|pulley)' }
          if ($found) {
            Write-Host "::error::corex links a wasm runtime but never loads plugins"
            $found | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "OK: $($tree.Count) 个 crate，未打包 wasm 运行时"

      # `schemas/directive.schema.json` 是编辑器用来校验和补全 Directive 的，
      # 陈旧副本会误导每个写指令的人。这一步从 `corex-engine` 的类型重新生成，
      # 并在检入文件与之不一致时失败。
      - name: Directive schema is up to date
        run: cargo test -p corex-engine --features schema --locked --test directive_schema

  msrv:
    name: msrv (1.95)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}

      # 根清单里的 `rust-version` 声明了 1.95；这个任务就是让该声明成真。
      # 1.95 是依赖图（`cargo metadata`）中最高的 `rust_version`——当某个依赖
      # 要求更新的编译器时，两处一起提升。
      - name: cargo check (MSRV)
        run: cargo check --workspace --locked

  supply-chain:
    name: supply chain
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,typos

      - name: cargo deny
        run: cargo deny check

      - name: typos
        run: typos

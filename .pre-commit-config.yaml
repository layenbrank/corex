# pre-commit hooks for corex (Windows-friendly entries; no bash wrappers).
# Adapted from tyr-rust-bootcamp/template — without Python black / nextest.
# Install: `uv tool install pre-commit` then `pre-commit install`
# Run all: `pre-commit run --all-files`

fail_fast: false
default_language_version:
  python: python3

# Editor / build / binary trees — not project source under review.
exclude: ^(target/|assets/|pdfium/|\.cursor/|\.idea/|\.agents/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        exclude: ^examples/
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Format Rust sources with rustfmt (check mode).
        entry: cargo fmt -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-deny
        name: cargo deny check
        description: Check dependency licenses, advisories, bans, and sources.
        entry: cargo deny check
        language: system
        files: ^(Cargo\.(toml|lock)|deny\.toml|crates/|bins/|pdfium/)
        pass_filenames: false

      - id: typos
        name: typos
        description: Spell-check source and docs with typos.
        entry: typos
        language: system
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        description: Type-check the workspace.
        entry: cargo check --workspace --locked
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

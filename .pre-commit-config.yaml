# corex 的 pre-commit 钩子（面向 Windows 的条目；不用 bash 包装）。
# 改编自 tyr-rust-bootcamp/template —— 去掉了 Python black / nextest。
# 安装：`uv tool install pre-commit`，然后 `pre-commit install`
# 全部运行：`pre-commit run --all-files`

fail_fast: false
default_language_version:
  python: python3

# 编辑器 / 构建 / 二进制目录——不属于要审查的项目源码。
exclude: ^(target/|assets/|pdfium/|\.cursor/|\.idea/|\.agents/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        exclude: ^examples/
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: 用 rustfmt 格式化 Rust 源码（仅检查模式）。
        entry: cargo fmt -- --check
        language: system
        types: [rust]
        pass_filenames: false

      # `--offline`（**全局**开关，必须写在子命令前）别去掉：cargo-deny 每次都会先去
      # github.com 拉一次 RustSec 公告库，拉失败就直接退出、不回退到缓存；而这条链路在
      # 本机既慢（20 s+）又不稳（连接被重置，或没有低速率超时挂上几分钟）。
      # 缓存库（`~/.cargo/advisory-dbs/`）已经够用，公告库的新鲜度交给 CI 的联网检查；
      # 想手动刷新，联网时跑一次 `cargo deny check`。
      - id: cargo-deny
        name: cargo deny check
        description: 检查依赖的许可证、安全公告、禁用项与来源（离线，用本地缓存库）。
        entry: cargo deny --offline check
        language: system
        files: ^(Cargo\.(toml|lock)|deny\.toml|crates/|bins/|pdfium/)
        pass_filenames: false

      - id: typos
        name: typos
        description: 用 typos 对源码与文档做拼写检查。
        entry: typos
        language: system
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        description: 对整个工作区做类型检查。
        entry: cargo check --workspace --locked
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

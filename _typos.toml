# corex 工作区的 typos 配置。
# https://github.com/crate-ci/typos

[default.extend-words]
# 产品 / crate / 协议名。
corex  = "corex"
pdfium = "pdfium"
ndjson = "ndjson"
Ndjson = "Ndjson"
serde  = "serde"
# 会触发缺省词典的 Windows / FFI 标识符。
hwnd   = "hwnd"
lparam = "lparam"
wparam = "wparam"
# 配置文档里故意写错的对照例：拼错的
# `strict_permissons` 正是解析器如今会拒绝的写法。
permissons = "permissons"

[files]
extend-exclude = [
  "CHANGELOG.md",
  "Cargo.lock",
  "target/**",
  "assets/**",
  "pdfium/**",
  "deny-check-out*.txt",
  "typos-out.txt",
  "**/*.dll",
  "**/*.exe",
  "**/*.png",
  "**/*.jpg",
  "**/*.webp",
]

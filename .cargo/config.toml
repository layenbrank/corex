[build]
# CI / Cloud Agent：不强制 sccache；本机可 export RUSTC_WRAPPER=sccache
target-dir  = "target"
incremental = true

# -------------------------- Windows 平台配置 --------------------------
[target.x86_64-pc-windows-msvc]
linker = "link.exe"
rustflags = [
  "-C",
  "target-feature=+crt-static",
  "-C",
  "link-arg=/SUBSYSTEM:CONSOLE",
  "-C",
  "link-arg=/OPT:REF",
]

# -------------------------- Linux 平台配置 --------------------------
[target.x86_64-unknown-linux-gnu]
# 默认使用系统 cc；有 mold/lld 时可自行覆盖
rustflags = []

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = [
  "-C",
  "target-feature=+crt-static",
]

# -------------------------- macOS 平台配置 --------------------------
[target.x86_64-apple-darwin]
linker = "clang"
rustflags = [
  "-C",
  "link-arg=-dead_strip",
  "-C",
  "link-arg=-mmacosx-version-min=10.15",
]

[target.aarch64-apple-darwin]
linker = "clang"
rustflags = [
  "-C",
  "target-cpu=apple-m1",
]

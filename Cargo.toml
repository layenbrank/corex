[workspace]
members  = ["crates/*", "bins/*", "pdfium"]
resolver = "2"

[workspace.package]
version     = "5.0.0"
edition     = "2024"
description = "corex — composable Directive / action runtime"
authors     = ["layen"]
license     = "MIT"

[workspace.dependencies]
# Internal crates
corex-core       = { path = "crates/core" }
corex-engine     = { path = "crates/engine" }
corex-registry   = { path = "crates/registry" }
corex-ipc        = { path = "crates/ipc" }
corex-plugin-sdk = { path = "crates/plugin-sdk" }

# Async / runtime
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "macros",
  "fs",
  "sync",
  "io-util",
  "net",
  "process",
  "signal",
  "time",
] }
async-trait = "0.1.92"
futures = "0.3.34"
tokio-cron-scheduler = "0.15.1"
fs2 = "0.4"

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml  = "0.0.13"
toml       = "1.1.4"

# Error / logging
anyhow             = "1.0"
thiserror          = "2.0.20"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI / util
clap        = { version = "4.6.6", features = ["derive"] }
regex       = "1.11"
once_cell   = "1.20"
directories = "6.0.0"
dirs        = "6.0"
uuid        = { version = "1.25.0", features = ["v4"] }
chrono      = { version = "0.4", features = ["serde"] }
tempfile    = "3.14"
proptest   = "1.5"

# Builtin action deps
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "query",
  "rustls",
] }
arboard = "3.4"
notify-rust = "4.11"
minijinja = "2.5"
keyring = "4.1.6"
interprocess = { version = "2.2", features = ["tokio"] }
walkdir = "2.5"
glob = "0.3"
base64 = "0.23.1"
md-5 = "0.11.0"
sysinfo = "0.39.6"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "bmp",
  "gif",
  "tiff",
] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
flate2 = "1.0"
tar = "0.4"
sevenz-rust2 = { version = "0.22.2", default-features = false, features = [
  "util",
] }
rand = "0.10.2"
lopdf = "0.44.0"

# Windows API (target-gated consumers use `[target.'cfg(windows)'.dependencies]`)
windows = { version = "0.62.2", features = [
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Foundation",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Diagnostics_ToolHelp",
] }

# WASM plugins (optional; enabled via corex-registry `wasm` feature)
wasmtime = { version = "48.0.1", default-features = false, features = [
  "component-model",
  "async",
  "cranelift",
  "runtime",
  "cache",
] }
wasmtime-wasi = { version = "48.0.1" }

# Test
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
incremental   = false
panic         = "abort"
strip         = "symbols"

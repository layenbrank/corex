[workspace]
members  = ["crates/*", "bins/*", "pdfium"]
resolver = "2"

[workspace.package]
version     = "4.0.0"
edition     = "2021"
description = "corex — composable shortcut / action runtime"
authors     = ["layen"]
license     = "MIT"

[workspace.dependencies]
# Internal crates
corex-core       = { path = "crates/core" }
corex-engine     = { path = "crates/engine" }
corex-registry   = { path = "crates/registry" }
corex-ipc        = { path = "crates/ipc" }
corex-plugin-sdk = { path = "crates/plugin-sdk" }

# Async / runtime
tokio            = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "sync", "io-util", "net", "process", "signal", "time"] }
async-trait      = "0.1"
futures          = "0.3"
tokio-cron-scheduler = "0.13"
fs2              = "0.4"

# Serialization
serde            = { version = "1.0", features = ["derive"] }
serde_json       = "1.0"
serde_yml        = "0.0.12"
toml             = "0.8"

# Error / logging
anyhow           = "1.0"
thiserror        = "2.0"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI / util
clap             = { version = "4.5", features = ["derive"] }
regex            = "1.11"
once_cell        = "1.20"
directories      = "5.0"
dirs             = "6.0"
uuid             = { version = "1.11", features = ["v4"] }
chrono           = { version = "0.4", features = ["serde"] }
tempfile         = "3.14"

# Builtin action deps
reqwest          = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
arboard          = "3.4"
notify-rust      = "4.11"
minijinja        = "2.5"
keyring          = "3.6"
interprocess     = { version = "2.2", features = ["tokio"] }

# Test
assert_cmd       = "2.0"
predicates       = "3.1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
incremental   = false
panic         = "abort"
strip         = "symbols"

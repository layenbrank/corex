# Corex 运行时配置
# 中文说明见 docs/guide/运行时配置.md

[daemon]
# 下列路径若非绝对路径，则在平台数据目录下解析
# （例如 Linux 的 ~/.local/share/corex）。
#
# IPC 端点。**省略即平台默认**，这也是跨平台共用一份配置时唯一不会踩坑的写法：
#   Unix    → <数据目录>/corex.sock
#   Windows → \\.\pipe\corex
#
# 要改就按平台改：Unix 写 socket 路径（相对名或绝对路径），Windows **只能**写命名
# 管道——写成 Unix 风格的文件路径会在启动时直接被拒，而不是静默回退。
#
# Unix：
# socket_path = "corex.sock"
# Windows（TOML 单引号字面量，反斜杠不必转义）：
# socket_path = '\\.\pipe\corex'
#
# 单例锁文件
lock_path = "corex.lock"
# IPC 共享认证密钥。设置环境变量 COREX_TOKEN 时以它优先。
# 留空 / 省略 → 守护进程读取或创建 `<data_dir>/token`（随机 32 字节 hex，Unix 上权限 0600）。
# token = ""
#
# 同时**执行**的请求数上限：`run_directive` 与 `invoke` 排这个队。
#   1        = 串行。一条指令跑着时，别的执行请求在队列里等——UI 自动化要的就是这个，
#              两条指令同时驱鼠标键盘必然互相踩。
#   > 1      = 最多同时跑这么多。
#   0        = 不限。
#
# 默认 4：宿主的「多任务并跑」（构建、拷贝、压缩之类互不相干的重活）本就互不干扰，
# 串起来只会让后面几条一直排队。排队期间请求每两秒收到一帧心跳（见 docs/reference/IPC协议.md）。
#
# 控制类请求（ping / shutdown / list_*）**不排这个队**：它们是宿主判断「daemon 还活着吗」
# 的手段，被一条几分钟的指令堵住才是最糟的。
# max_jobs = 4

[plugins]
# 插件目录（相对数据目录，或绝对路径）
plugin_dir = "plugins"
# 按 id 禁用整个插件
disabled = []
# 禁用单个动作 id（如 "shell.run"）
disabled_actions = []

[history]
# 数据目录下的追加式 JSONL
enabled = true
file    = "history.jsonl"

[logging]
level = "info"
json  = false

[runtime]
# parallel 块内最大并行步数
max_parallel = 8
# 单步超时秒数（0 = 不限制）
step_timeout = 0
# 企业模式：为 true 时拒绝没有 permissions 块的指令
strict_permissions = false
# file.* 允许的根目录（留空 = 不限制；企业模式设为数据目录）
# filesystem_roots = []
# 单次指令运行内 ui.wait 总毫秒上限（0 = 不限制）
# ui_settle_limit = 0
# UI 自动化档位：baseline | fast | patient
# ui_profile = "baseline"
# ui.element.* 的 selectors[] 回退链上限（baseline=8，fast=5，patient=12）
# ui_selector_depth = 8

[update]
# 通过 GitHub Releases 自更新（`corex update`）。见 docs/reference/自更新.md
# 总开关；企业 / 内网部署设为 false
enabled = true
# CLI 启动时限频检查新版本（在 stderr 提示）
check_on_start = true
# 两次后台检查之间的最小小时间隔（0 = 每次运行都查）
check_interval = 24
# 发布渠道：stable | alpha | beta | rc
channel = "stable"
# GitHub 仓库 slug
repository = "layenbrank/corex"
# 覆盖 GitHub API 基址（GitHub Enterprise / 内部镜像）
# api_base_url = "https://github.example.com/api/v3"
# 存放 GitHub token 的环境变量；可突破匿名 60 次/小时的 API 限制
token_env = "COREX_GITHUB_TOKEN"
# 仅 Windows：未设置 HTTPS_PROXY 时回退到系统（WinINET）代理
use_system_proxy = true
# 替换正在运行的可执行文件前先询问
require_confirmation = true
# 单次 HTTP 请求超时秒数
timeout = 30

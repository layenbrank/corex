# Corex runtime configuration

[daemon]
# Paths below that are not absolute are resolved under the platform data dir
# (e.g. ~/.local/share/corex on Linux). Windows named pipes like \\.\pipe\corex are used as-is.
# IPC endpoint: Unix socket path or Windows named pipe
# Windows pipe is \\.\pipe\corex when unset at runtime
socket_path = "corex.sock"
# Singleton lock file
lock_path = "corex.lock"
# Shared IPC auth secret. Prefer env COREX_TOKEN when set.
# Empty / omitted → daemon reads or creates `<data_dir>/token` (random 32-byte hex, mode 0600 on Unix).
# token = ""

[plugins]
# Plugin directory (relative to data dir, or absolute)
plugin_dir = "plugins"
# Disable entire plugins by id
disabled = []
# Disable individual action ids (e.g. "shell.run")
disabled_actions = []

[history]
# Append-only JSONL under the data directory
enabled = true
file = "history.jsonl"

[logging]
level = "info"
json = false

[runtime]
# Max parallel steps in a parallel block
max_parallel = 8
# Step timeout in seconds (0 = none)
step_timeout_secs = 0
# Enterprise: deny directives with no permissions block when true
strict_permissions = false
# Allowed roots for file.* (empty = no confine; enterprise sets data dir)
# filesystem_roots = []
# Cap total ui.wait ms per directive run (0 = unlimited)
# ui_max_settle_ms = 0
# UI automation profile: baseline | fast | patient
# ui_profile = "baseline"
# Max selectors[] fallback chain for ui.element.* (baseline=8, fast=5, patient=12)
# ui_max_selector_chain = 8

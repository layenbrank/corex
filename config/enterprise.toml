# Enterprise preset (locked-down)

# Copy or merge into your runtime config for production.

[runtime]
strict_permissions = true
# Confine file/copy/codec/exec script/cwd … path I/O under these roots (use absolute paths in deploy)
filesystem_roots = ["C:/ProgramData/corex/data"]
ui_max_settle_ms = 500

[plugins]
# Or disable the whole UI plugin: disabled = ["ui"]
disabled_actions = [
  "shell.run",
  "exec.run",
  "ui.window.list",
  "ui.window.desktop",
  "ui.window.focus",
  "ui.window.find",
  "ui.window.wait",
  "ui.element.list",
  "ui.element.find",
  "ui.element.point",
  "ui.element.pick",
  "ui.element.click",
  "ui.element.wait",
  "ui.element.exists",
  "ui.wait",
  "ui.click",
  "ui.type",
  "ui.key",
  "ui.scroll",
  "ui.drag",
  "ui.element.get",
  "ui.element.set",
  "capture.ocr",
  "capture.screenshot",
  "capture.monitors",
  "capture.find",
  "dialog.alert",
  "dialog.confirm",
  "dialog.prompt",
  "url.open",
  "process.list",
  "process.kill",
  "keyring.get",
  "keyring.set",
  "scan.os",
]

[logging]
level = "info"
json = true

[history]
enabled = true
file = "history.jsonl"

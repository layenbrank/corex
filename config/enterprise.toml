# 企业预设（锁紧配置）

# 生产环境请复制或合并进你的运行时配置。

[runtime]
strict_permissions = true
# 把 file/copy/codec/exec 脚本/cwd 等路径 I/O 限制在这些根目录下（部署时用绝对路径）
filesystem_roots = ["C:/ProgramData/corex/data"]
ui_settle_limit = 500

[plugins]
# 也可以直接禁用整个 UI 插件：disabled = ["ui"]
disabled_actions = [
  "shell.run",
  "exec.run",
  "ui.window.list",
  "ui.window.desktop",
  "ui.window.focus",
  "ui.window.find",
  "ui.window.wait",
  "ui.element.list",
  "ui.element.find",
  "ui.element.point",
  "ui.element.pick",
  "ui.element.click",
  "ui.element.wait",
  "ui.element.exists",
  "ui.wait",
  "ui.click",
  "ui.type",
  "ui.key",
  "ui.scroll",
  "ui.drag",
  "ui.element.get",
  "ui.element.set",
  "capture.ocr",
  "capture.screenshot",
  "capture.monitors",
  "capture.find",
  "dialog.alert",
  "dialog.confirm",
  "dialog.prompt",
  "url.open",
  "process.list",
  "process.kill",
  "keyring.get",
  "keyring.set",
  "scan.os",
]

[logging]
level = "info"
json  = true

[history]
enabled = true
file    = "history.jsonl"

[update]
# 锁紧：不使用 `corex update`，也不做外联版本检查。
# 只在受审计的内部镜像（`api_base_url`）后方才重新开启。
enabled        = false
check_on_start = false

[package]
name        = "corex"
version     = { workspace = true }
edition     = { workspace = true }
description = "Corex CLI — run directives, manage daemon, inspect actions"
authors     = { workspace = true }
license     = { workspace = true }

[[bin]]
name = "corex"
path = "src/main.rs"

[dependencies]
corex-core   = { workspace = true }
corex-engine = { workspace = true, features = ["triggers"] }
# 沿用 `default = ["all-actions"]`，其中刻意不含 `wasm`：
# `corex run` 在进程内执行指令，从不加载插件
# （`discovery::discover` 只属于守护进程），所以这里的 wasm 运行时是
# 够不着的体积。`quality.yml` 的 `features` 任务断言 CLI
# 依赖树里不含 wasmtime。
corex-registry = { workspace = true }
corex-ipc      = { workspace = true }
corex-updater  = { workspace = true }
anyhow         = { workspace = true }
chrono         = { workspace = true }
clap           = { workspace = true }
# `unstable-dynamic`：补全候选由 `corex` 自己现算（`COMPLETE=<shell> corex --`），
# 升级后不必重新生成脚本，见 `main.rs` 开头的 `CompleteEnv`。
clap_complete      = { workspace = true, features = ["unstable-dynamic"] }
dialoguer          = { workspace = true }
indicatif          = { workspace = true }
rustyline          = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# `tests/cli.rs` 通过 `CARGO_BIN_EXE_corex` 驱动真实二进制。
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
# 控制台输出代码页：中文在 cp936 的传统控制台里会乱码（见 `output::use_utf8_console`）。
# 复用仓库既有的 `windows` 绑定，不再引第二套。
windows = { workspace = true, features = ["Win32_System_Console"] }

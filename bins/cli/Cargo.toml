[package]
name        = "corex"
version     = { workspace = true }
edition     = { workspace = true }
description = "Corex CLI — run directives, manage daemon, inspect actions"
authors     = { workspace = true }
license     = { workspace = true }

[[bin]]
name = "corex"
path = "src/main.rs"

[dependencies]
corex-core         = { workspace = true }
corex-engine       = { workspace = true, features = ["triggers"] }
# 沿用 `default = ["all-actions"]`，其中刻意不含 `wasm`：
# `corex run` 在进程内执行指令，从不加载插件
# （`discovery::discover` 只属于守护进程），所以这里的 wasm 运行时是
# 够不着的体积。`quality.yml` 的 `features` 任务断言 CLI
# 依赖树里不含 wasmtime。
corex-registry     = { workspace = true }
corex-ipc          = { workspace = true }
corex-updater      = { workspace = true }
anyhow             = { workspace = true }
clap               = { workspace = true }
dialoguer          = { workspace = true }
indicatif          = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# `tests/cli.rs` 通过 `CARGO_BIN_EXE_corex` 驱动真实二进制。
tempfile = { workspace = true }

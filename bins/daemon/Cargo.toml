[package]
name        = "corex-daemon"
version     = { workspace = true }
edition     = { workspace = true }
description = "Corex background daemon — IPC server for directives & actions"
authors     = { workspace = true }
license     = { workspace = true }

[[bin]]
name = "corex-daemon"
path = "src/main.rs"

[dependencies]
corex-core   = { workspace = true }
corex-engine = { workspace = true }
# 守护进程是唯一发现并加载 WASM 插件的二进制，因此只有它在默认的
# `all-actions` 之上额外开启 `wasm`。
corex-registry     = { workspace = true, features = ["wasm"] }
corex-ipc          = { workspace = true }
anyhow             = { workspace = true }
clap               = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
fs2                = { workspace = true }
rand               = { workspace = true }
